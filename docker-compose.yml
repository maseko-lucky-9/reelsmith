name: reelsmith

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reelsmith
      POSTGRES_PASSWORD: reelsmith
      POSTGRES_DB: reelsmith
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the volume is first initialised; the test fixture also creates the DB if missing.
      - ./scripts/initdb/10-create-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelsmith"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
