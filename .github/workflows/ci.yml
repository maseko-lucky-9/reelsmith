name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reelsmith
          POSTGRES_PASSWORD: reelsmith
          POSTGRES_DB: reelsmith
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit + contract tests
        run: pytest

      - name: Apply database migrations
        env:
          YTVIDEO_DB_URL: postgresql+asyncpg://reelsmith:reelsmith@localhost:5432/reelsmith
          YTVIDEO_JOB_STORE: sql
        run: alembic upgrade head

      # Models must equal the migrated schema (T018): any drift fails CI.
      - name: Check models match migrations
        env:
          YTVIDEO_DB_URL: postgresql+asyncpg://reelsmith:reelsmith@localhost:5432/reelsmith
          YTVIDEO_JOB_STORE: sql
        run: alembic check

      # Offline mode renders every revision (incl. data migrations) as SQL
      # for the Postgres dialect without touching the database.
      - name: Render migrations as offline SQL
        env:
          YTVIDEO_DB_URL: postgresql+asyncpg://reelsmith:reelsmith@localhost:5432/reelsmith
          YTVIDEO_JOB_STORE: sql
        run: alembic upgrade head --sql > /dev/null

      # faster-whisper `base` (~145 MB) for tests/integration/test_whisper_real.py
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-faster-whisper-base-v1

      - name: Run integration tests
        env:
          YTVIDEO_DB_URL: postgresql+asyncpg://reelsmith:reelsmith@localhost:5432/reelsmith
          YTVIDEO_JOB_STORE: sql
        run: pytest -m integration

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install frontend dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: cd web && pnpm test

      - name: Build frontend
        run: cd web && pnpm build

  # Constitution principle VI: secrets scan. On push/PR the action scans only
  # the new commits; the allowlist in .gitleaks.toml covers full-history scans.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action comments on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
